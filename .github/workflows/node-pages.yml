name: Publish browser node

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/node-pages.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build browser-node dependencies
        run: npm run build

      - name: Build Monaco editor
        run: npm run build:monaco -w @leofcoin/node

      - name: Build browser node
        run: npm run build -w @leofcoin/node

      - name: Validate static site
        run: npm run validate:static -w @leofcoin/node

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/node/www

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
