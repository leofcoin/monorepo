name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces with Rage
        run: npm run build-all

      - name: Run tests
        run: npm test

      - name: Test shared genesis planner and browser controllers
        run: npm test -w @leofcoin/lib -w @leofcoin/node

      - name: Test packed launcher with registry transports and real genesis
        run: npm run test:package -w @leofcoin/launch-chain

      - name: Test durable faucet payouts and HTTP limits
        run: npm test -w @leofcoin/faucet

      - name: Run multi-process E2E tests
        run: node --test test/e2e/*.test.js

      - name: Verify real transfers, cold sync and restart across isolated nodes
        timeout-minutes: 5
        run: npm run test:chain-benchmark && npm run test:e2e:chain-runtime

      - name: Verify four-validator quorum, partitions and crash recovery
        timeout-minutes: 5
        run: npm run test:e2e:consensus-runtime

      # Keep browser failures visible without preventing the chain's distributed
      # recovery/consensus checks from being executed first.
      - name: Test browser wallet and passkey unlock
        timeout-minutes: 8
        working-directory: packages/node
        env:
          RUN_SHELL_UI_TESTS: '1'
          SHELL_UI_CHROME_NO_SANDBOX: '1'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          test -n "$CHROME_BIN"
          node --test test/shell-ui.test.js
