name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces with Rage
        run: npm run build-all

      - name: Run tests
        run: npm test

      - name: Test packed launcher with registry transports and real genesis
        run: npm run test:package -w @leofcoin/launch-chain

      - name: Test durable faucet payouts and HTTP limits
        run: npm test -w @leofcoin/faucet

      - name: Run multi-process E2E tests
        run: node --test test/e2e/*.test.js
